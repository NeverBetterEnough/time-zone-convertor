<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>时区切换器</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header class="brand"><img src="icons/clock.svg" width="35" height="35" alt=""><div><h1>时区切换器</h1><p>命中域名规则，才主动切换</p></div><span class="version">1.2</span></header>
  <section class="power-panel"><div><span id="powerLabel" class="power-label">正在连接…</span><p id="powerDescription">规则加载中</p></div><label class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="启用域名规则" disabled><span></span></label></section>
  <section class="settings-panel">
    <div class="field-label">当前域名 <span id="host">—</span></div>
    <div class="rule-summary"><span id="ruleName">未命中规则</span><strong id="targetZone">不设置时区</strong></div>
    <div id="preview" class="preview" hidden><span id="previewDate">命中规则的地区时间预览</span><strong id="previewTime">--:--:--</strong><span id="previewOffset">—</span></div>
    <button id="manageRules" class="primary" disabled>管理域名规则</button>
    <button id="addCurrent" class="add-current" disabled>为当前域名添加规则</button>
  </section>
  <section class="status-panel" aria-live="polite"><div class="section-title"><h2>当前标签页</h2><span id="statusBadge" class="pill">检测中</span></div><p id="statusDetail">正在读取状态…</p><dl id="observed" hidden><div><dt>网页报告时区</dt><dd id="observedZone"></dd></div><div><dt>网页本地时间</dt><dd id="observedTime"></dd></div></dl><p id="childWarning" class="warning" hidden></p><div class="button-row"><button id="reapply" disabled>重新应用</button><button id="reload" disabled>应用并刷新此页</button></div></section>
  <p id="error" class="error" role="alert" hidden></p>
  <footer><span id="summary">—</span><button id="diagnostics" class="text-button">检测与帮助 ↗</button></footer>
  <p class="footnote">未命中时插件不主动设置时区。原生模拟可能影响共享渲染进程的其他页面；命中页会出现 Chrome 调试提示条。</p>
</main><script type="module" src="popup.js"></script></body></html>
